name: P0 bootstrap package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_STATE_DIR: ${{ runner.temp }}/p0-synthetic-state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2a59c7090e39d379be31cf69b1ace140707aac3c
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Install pinned toolchain and frozen dependencies
        run: |
          npm install --global pnpm@12.4.0
          pnpm install --frozen-lockfile
      - name: Build and verify installable package
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2a59c7090e39d379be31cf69b1ace140707aac3c
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/p0-artifact"
          node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog --output-dir "$RUNNER_TEMP/p0-artifact" --output-name openclaw-p0-2a59c7090e39d379be31cf69b1ace140707aac3c.tgz
          git rev-parse HEAD > "$RUNNER_TEMP/p0-artifact/source-sha.txt"
          node --version > "$RUNNER_TEMP/p0-artifact/toolchain.txt"
          pnpm --version >> "$RUNNER_TEMP/p0-artifact/toolchain.txt"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/p0-artifact/lockfile.sha256"
          test -z "$(git status --porcelain)"
          cd "$RUNNER_TEMP/p0-artifact"
          sha256sum *.tgz source-sha.txt toolchain.txt lockfile.sha256 > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p0-bootstrap-2a59c7090e39d379be31cf69b1ace140707aac3c
          path: ${{ runner.temp }}/p0-artifact/
          if-no-files-found: error
          retention-days: 7
